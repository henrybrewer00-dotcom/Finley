name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: finley
          POSTGRES_PASSWORD: finley
          POSTGRES_DB: finley_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FINLEY_TEST_DATABASE_URL: postgresql://finley:finley@localhost:5432/finley_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" httpx
      - run: pytest -q
      - run: finley bench --dry-run --limit 5 --out /tmp/bench
